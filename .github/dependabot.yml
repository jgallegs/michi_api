version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # [FORK H-30] las dependencias se actualizan junto con Bruno (R-33)
  
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # [FORK H-30] las dependencias se actualizan junto con Bruno (R-33)
    groups:
      bruno-dependencies:
        patterns:
          - "*usebruno*"
      babel-dependencies:
        patterns:
          - "*babel*"
      fortawesome-dependencies:
        patterns:
          - "*fortawesome*"
      electron-dependencies:
        patterns:
          - "*electron*"
      rollup-dependencies:
        patterns:
          - "*rollup*"
      jest-dependencies:
        patterns:
          - "*jest*"
